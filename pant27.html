<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLONX – Pant #27 Mathias</title>

    <link rel="stylesheet" href="https://use.typekit.net/gsi8cqu.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <button
        class="burger"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="menu"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <a href="index.html" class="logo">
          <img src="img/scottexlogo.svg" alt="SLONX" />
        </a>

        <p class="subtitle">Custom garments</p>
      </div>

      <nav class="social" id="menu">
        <a href="https://www.instagram.com/" target="_blank" rel="noopener">
          Instagram
        </a>

        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">
          Contact
        </a>
      </nav>
    </header>

    <main class="page">
      <figure class="pant-hero">
        <img src="img/mathias27-1.svg" alt="Pant #27 Mathias" />
        <figcaption>Pant #27 Mathias</figcaption>
      </figure>

      <section class="pant-grid">
        <img src="img/billede1.svg" alt="Detalje 1" />
        <img src="img/billede2.svg" alt="Detalje 2" />
        <img src="img/billede3.svg" alt="Detalje 3" />
        <img src="img/billede4.svg" alt="Detalje 4" />
      </section>

      <footer class="signature">
        <p>by Benjamin Scott</p>
        <img src="img/signature.svg" alt="Benjamin Scott" />
      </footer>
    </main>

    <a
      href="https://scottex.dk/pages/contact"
      class="book-btn"
      target="_blank"
      rel="noopener"
    >
      Book an appointment
    </a>

    <script>
      /* Burger-menu */
      const burger = document.querySelector(".burger");
      const menu = document.querySelector("#menu");

      burger.addEventListener("click", () => {
        const isOpen = menu.classList.toggle("open");

        burger.classList.toggle("open", isOpen);
        burger.setAttribute("aria-expanded", String(isOpen));
      });
    </script>
  </body>
</html>
