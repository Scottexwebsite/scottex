<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLONX – Pant #27 Mathias</title>

    <link rel="stylesheet" href="https://use.typekit.net/gsi8cqu.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <button
        class="burger"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="menu"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <a href="index.html" class="logo">
          <img src="img/scottexlogo.svg" alt="SLONX" />
        </a>

        <p class="subtitle">Custom garments</p>
      </div>

      <nav class="social" id="menu">
        <a
          href="https://www.instagram.com/scottex___"
          target="_blank"
          rel="noopener"
        >
          Instagram
        </a>

        <a
          href="https://scottex.dk/pages/contact"
          target="_blank"
          rel="noopener"
        >
          Contact
        </a>
      </nav>
    </header>

    <main class="page page-pants27">
      <figure class="pant-hero">
        <img src="img/mathiaspants.webp" alt="Pant #27 Mathias" />
        <figcaption>Pant #27 Mathias</figcaption>
      </figure>

      <section class="pant-grid">
        <img src="img/mathias1.webp" alt="Detalje 1" />
        <img src="img/mathias2.webp" alt="Detalje 2" />
        <img src="img/mathias3.webp" alt="Detalje 3" />
        <img src="img/mathias4.webp" alt="Detalje 4" />
      </section>

      <footer class="signature">
        <p>by Benjamin Scott</p>
        <img src="img/signature.svg" alt="Benjamin Scott" />
      </footer>
    </main>

    <a
      href="https://scottex.dk/pages/contact"
      class="book-btn"
      target="_blank"
      rel="noopener"
    >
      Book an appointment
    </a>

    <div class="lightbox" id="pant-lightbox" aria-hidden="true">
      <div class="lightbox-frame">
        <button
          type="button"
          class="lightbox-close"
          id="lightbox-close"
          aria-label="Luk billede"
        >
          &times;
        </button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      </div>
    </div>

    <script>
      /* Burger-menu */
      const burger = document.querySelector(".burger");
      const menu = document.querySelector("#menu");

      burger.addEventListener("click", () => {
        const isOpen = menu.classList.toggle("open");

        burger.classList.toggle("open", isOpen);
        burger.setAttribute("aria-expanded", String(isOpen));
      });

      /* Lightbox på pant-billeder */
      (function () {
        const lightbox = document.getElementById("pant-lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const closeBtn = document.getElementById("lightbox-close");
        const images = document.querySelectorAll(
          ".page-pants27 .pant-hero img, .page-pants27 .pant-grid img, .page-pant26 .pant-hero img, .page-pant26 .pant-grid img",
        );

        if (!lightbox || !lightboxImg || !closeBtn || !images.length) return;

        function openLightbox(src, alt) {
          lightboxImg.src = src;
          lightboxImg.alt = alt || "";
          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImg.src = "";
          document.body.style.overflow = "";
        }

        images.forEach((img) => {
          img.addEventListener("click", () => {
            openLightbox(img.currentSrc || img.src, img.alt);
          });
        });

        closeBtn.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) {
            closeLightbox();
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && lightbox.classList.contains("open")) {
            closeLightbox();
          }
        });
      })();
    </script>
  </body>
</html>
