<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLONX – custom garments</title>
    <link rel="stylesheet" href="https://use.typekit.net/gsi8cqu.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <button
        class="burger"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <a href="index.html" class="logo">
          <img src="img/scottexlogo.svg" alt="SLONX" />
        </a>
        <p class="subtitle">Custom garments</p>
      </div>

      <nav class="social" id="menu">
        <a
          href="https://scottex.dk/pages/contact"
          target="_blank"
          rel="noopener"
          >Contact</a
        >
        <a href="https://www.instagram.com/" target="_blank" rel="noopener"
          >Instagram</a
        >
      </nav>
    </header>

    <main>
      <!-- Desktop: tre felter ved siden af hinanden. Mobil: swipe-karrusel -->
      <section class="steps">
        <figure class="step">
          <a href="measurements.html" class="step-link">
            <img src="img/measurement.png" alt="Kropsmålinger" />
            <figcaption>get measured</figcaption>
          </a>
        </figure>

        <figure class="step">
          <a href="3d.html" class="step-link">
            <img class="step-gif" src="3Dvideo.gif" alt="3D work" />
            <figcaption>3D work</figcaption>
          </a>
        </figure>

        <figure class="step">
          <a href="pants.html" class="step-link">
            <img src="img/trousers.png" alt="Færdige denim pants" />
            <figcaption>receive your new denim pants</figcaption>
          </a>
        </figure>
      </section>

      <!-- Prikker under karrusellen (kun mobil) -->
      <div class="dots">
        <button class="dot" aria-label="Billede 1"></button>
        <button class="dot" aria-label="Billede 2"></button>
        <button class="dot" aria-label="Billede 3"></button>
      </div>

      <section class="info" id="info">
        <p class="intro">
          Your new favourite measure garments<br />located in Nørrebro.
        </p>

        <!-- Vises, før man har svaret -->
        <div class="ask">
          <p class="question">Do you feel connected to the brand already?</p>

          <div class="choices">
            <button type="button" class="pill answer">yes</button>
            <button type="button" class="pill answer">no</button>
          </div>
        </div>

        <!-- Vises, efter man har svaret -->
        <div class="thanks">
          <p>
            Thank you for your feedback!<br />
            If you want to know more<br />
            check out our Instagram
          </p>

          <a
            href="https://www.instagram.com/"
            class="insta"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
          >
            <svg
              viewBox="0 0 24 24"
              width="44"
              height="44"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4.2" />
              <circle
                cx="17.2"
                cy="6.8"
                r="0.7"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </a>
        </div>
      </section>

      <footer class="signature">
        <p>by Benjamin Scott</p>
        <img src="img/signature.svg" alt="Benjamin Scott" />
      </footer>
    </main>

    <a
      href="https://scottex.dk/pages/contact"
      class="book-btn"
      target="_blank"
      rel="noopener"
      >Book an appointment</a
    >

    <script>
      /* Burger-menu */
      const burger = document.querySelector(".burger");
      const menu = document.querySelector("#menu");

      burger.addEventListener("click", () => {
        const open = burger.classList.toggle("open");
        menu.classList.toggle("open", open);
        burger.setAttribute("aria-expanded", open);
      });

      /* Yes / no: skift spørgsmålet ud med tak-beskeden */
      const info = document.querySelector("#info");

      document.querySelectorAll(".answer").forEach((button) => {
        button.addEventListener("click", () => {
          info.classList.add("answered");
        });
      });

      /* Karrusel (kun mobil) */
      const steps = document.querySelector(".steps");
      const slides = [...steps.children];
      const dots = document.querySelectorAll(".dot");
      const mobile = window.matchMedia("(max-width: 900px)");

      function scrollToSlide(i, behavior = "auto") {
        const slide = slides[i];
        steps.scrollTo({
          left: slide.offsetLeft - (steps.clientWidth - slide.offsetWidth) / 2,
          behavior,
        });
      }

      /* Marker den prik, der svarer til det billede, der står i midten */
      function updateDots() {
        const center = steps.scrollLeft + steps.clientWidth / 2;
        let closest = 0;
        let min = Infinity;

        slides.forEach((slide, i) => {
          const distance = Math.abs(
            slide.offsetLeft + slide.offsetWidth / 2 - center,
          );
          if (distance < min) {
            min = distance;
            closest = i;
          }
        });

        dots.forEach((dot, i) => dot.classList.toggle("active", i === closest));
      }

      function setupMobile() {
        if (!mobile.matches) return;
        scrollToSlide(1); /* start på det midterste billede */
        updateDots();
      }

      steps.addEventListener("scroll", updateDots, { passive: true });
      dots.forEach((dot, i) =>
        dot.addEventListener("click", () => scrollToSlide(i, "smooth")),
      );

      setupMobile();
      window.addEventListener("load", setupMobile);
      mobile.addEventListener("change", setupMobile);
    </script>
  </body>
</html>
