<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLONX – craftmanship denim pants</title>
    <link rel="stylesheet" href="https://use.typekit.net/gsi8cqu.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#" class="logo">
        <!-- Udskift med dit eget logo: <img src="img/logo.svg" alt="SLONX"> -->
        <img src="img/scottexlogo.svg" alt="SLONX" />
      </a>

      <nav class="social">
        <a href="https://www.instagram.com/" target="_blank" rel="noopener"
          >Instagram</a
        >
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener"
          >LinkedIn</a
        >
      </nav>
    </header>

    <main>
      <section class="steps">
        <figure class="step">
          <img src="img/measurement.png" alt="Kropsmålinger" />
          <figcaption>Get measured</figcaption>
        </figure>

        <figure class="step">
          <img class="step-gif" src="3Dvideo.gif" alt="Jeans go into 3D" />
          <figcaption>Jeans go into 3D</figcaption>
        </figure>

        <figure class="step">
          <img src="img/trousers.png" alt="Færdige denim pants" />
          <figcaption>Receive your new denim pants</figcaption>
        </figure>
      </section>

      <a href="#" class="button">Get more information</a>
    </main>
    <a href="https://scottex.dk/pages/contact" class="book-btn"
      >Book an appointment</a
    >
  </body>
</html>
