<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLONX – 3D work</title>

    <link rel="stylesheet" href="https://use.typekit.net/gsi8cqu.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <button
        class="burger"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="menu"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <a href="index.html" class="logo">
          <img src="img/scottexlogo.svg" alt="SLONX" />
        </a>

        <p class="subtitle">Custom garments</p>
      </div>

      <nav class="social" id="menu">
        <a
          href="https://www.instagram.com/scottex___"
          target="_blank"
          rel="noopener"
        >
          Instagram
        </a>

        <a
          href="https://scottex.dk/pages/contact"
          target="_blank"
          rel="noopener"
        >
          Contact
        </a>
      </nav>
    </header>

    <main class="page">
      <img class="page-media" src="3Dvideo.gif" alt="3D work" />

      <h1 class="page-title">3D WORK</h1>

      <p class="page-text">Text about what working with 3D means for him</p>

      <footer class="signature">
        <p>by Benjamin Scott</p>
        <img src="img/signature.svg" alt="Benjamin Scott" />
      </footer>
    </main>

    <a
      href="https://scottex.dk/pages/contact"
      class="book-btn"
      target="_blank"
      rel="noopener"
    >
      Book an appointment
    </a>

    <script>
      /* Burger-menu */
      const burger = document.querySelector(".burger");
      const menu = document.querySelector("#menu");

      burger.addEventListener("click", () => {
        const isOpen = menu.classList.toggle("open");

        burger.classList.toggle("open", isOpen);
        burger.setAttribute("aria-expanded", String(isOpen));
      });
    </script>
  </body>
</html>
